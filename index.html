<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toyota Oficinas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #212529; }
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #EB0A1E; padding: 20px;
    }
    .login-box {
      background: white; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center;
    }
    .login-box h1 { color: #EB0A1E; font-size: 28px; font-weight: 800; margin-bottom: 4px; letter-spacing: 1px; }
    .login-box .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
    .login-box input { width: 100%; padding: 14px 16px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
    .login-box input:focus { outline: none; border-color: #EB0A1E; }
    #login-btn { width: 100%; padding: 14px; background: #EB0A1E; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; margin-top: 16px; cursor: pointer; }
    #login-btn:disabled { opacity: 0.6; }
    #login-error { color: #c0392b; font-size: 14px; margin-top: 12px; min-height: 20px; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #EB0A1E; color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .logo { font-weight: 800; letter-spacing: 1px; }
    #main-content { flex: 1; padding: 16px; padding-bottom: 90px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e9ecef; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #6c757d; }
    .nav-btn.active { color: #EB0A1E; font-weight: 600; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .btn { background: #EB0A1E; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: 600; margin-top: 8px; }
    .btn-secondary { background: #495057; }
    .btn-danger { background: #dc3545; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; }
    .buttons-row { display: flex; gap: 8px; margin: 8px 0; }
    .btn-choice { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid #dee2e6; background: white; font-size: 14px; }
    .btn-choice.active.sim { background: #28a745; color: white; border-color: #28a745; }
    .btn-choice.active.nao { background: #dc3545; color: white; border-color: #dc3545; }
    .btn-choice.active.na { background: #6c757d; color: white; border-color: #6c757d; }
    .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status.completo { background: #d4edda; color: #155724; }
    .status.emcurso { background: #fff3cd; color: #856404; }
    .small { font-size: 12px; color: #6c757d; }
    .logout, .admin-btn { background: transparent; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 6px; }
    .area-title { background: #EB0A1E; color: white; padding: 8px 12px; border-radius: 8px; margin: 16px 0 8px; font-weight: 600; }
    .photo-preview { max-width: 100%; max-height: 140px; margin-top: 8px; border-radius: 8px; }
    .chart-container { background: white; border-radius: 12px; padding: 16px; margin: 12px 0; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    .score-item { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #e9ecef; }
    .score-item strong { display: block; font-size: 20px; color: #EB0A1E; }
    .report-header { text-align: center; background: white; padding: 20px 16px; border-radius: 12px; margin-bottom: 12px; border-bottom: 4px solid #EB0A1E; }
    .kpi-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .kpi-table th, .kpi-table td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
    .kpi-table th { background: #EB0A1E; color: white; }
    .gain-box { background: #d4edda; border: 1px solid #c3e6cb; padding: 16px; text-align: center; border-radius: 8px; font-size: 18px; font-weight: 700; color: #155724; margin: 12px 0; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .compare-table th, .compare-table td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
    .compare-table th { background: #343a40; color: white; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1>TOYOTA</h1>
      <div class="subtitle">Oficinas • Programa de Produtividade</div>
      <input type="email" id="email" placeholder="Email" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header class="header">
      <div class="logo">TOYOTA</div>
      <div id="header-title">Oficinas</div>
      <div>
        <button id="admin-btn" class="admin-btn" style="display:none;">Admin</button>
        <button class="logout" id="logout-btn">Sair</button>
      </div>
    </header>
    <main id="main-content"></main>
    <nav class="bottom-nav">
      <button data-view="oficinas" class="nav-btn active">🏢<br>Oficinas</button>
      <button data-view="relatorios" class="nav-btn">📄<br>Relatórios</button>
      <button data-view="visao" class="nav-btn">📊<br>Visão</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const { jsPDF } = window.jspdf;

    const MASTER_EMAIL = "jose.sousa@toyotacaetano.pt";
    const firebaseConfig = {
      apiKey: "AIzaSyBGKNteS2qFTEyBIglkeNWS05Tncz4Hygs",
      authDomain: "produtividade-toyota.firebaseapp.com",
      projectId: "produtividade-toyota",
      storageBucket: "produtividade-toyota.firebasestorage.app",
      messagingSenderId: "960937379651",
      appId: "1:960937379651:web:b6fc915247c7a82ca511f6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const secondaryApp = initializeApp(firebaseConfig, "secondary");
    const secondaryAuth = getAuth(secondaryApp);

    let workshops = [];
    const questions = [
      { area: "Agendamento", id: "1.1", text: "A oficina tem a capacidade de marcar um serviço no prazo máximo de 3 dias úteis?" },
      { area: "Agendamento", id: "1.2", text: "O Lead Time de marcação transmitido na chamada de cliente mistério está de acordo com a informação disponível no Quadro de Marcações?" },
      { area: "Agendamento", id: "1.3", text: "A atribuição dos trabalhos agendados é efetuada em conformidade com a matriz de competências e a certificação técnica de cada colaborador?" },
      { area: "Agendamento", id: "1.4", text: "Os Assessores de Serviço utilizam os códigos de operação padronizados (OTT) de acordo com o tipo de serviço agendado? Para operações locais, utilizam códigos de operação tabelados (OTI)?" },
      { area: "Agendamento", id: "1.5", text: "O planeamento da agenda é gerido ativamente para garantir uma taxa de ocupação do quadro de marcações de 110%?" },
      { area: "Agendamento", id: "1.6", text: "Os trabalhos em curso (reparações de continuidade ou pendentes) encontram-se devidamente identificados e contabilizados na capacidade diária do quadro de marcações?" },
      { area: "Agendamento", id: "1.7", text: "O cliente consegue estabelecer contacto com a oficina de uma forma rápida e eficaz? Em caso de não atendimento, é feita a devolução de chamada?" },
      { area: "Agendamento", id: "1.8", text: "Durante o contacto telefónico para agendamento, o interlocutor questiona proactivamente o cliente sobre necessidades adicionais, serviços complementares ou campanhas técnicas?" },
      { area: "Agendamento", id: "1.9", text: "A disponibilidade de slots de serviço na plataforma de Marcação Online (OSB) encontra-se alinhada e sincronizada com a capacidade real do DMS?" },
      { area: "Agendamento", id: "1.10", text: "As encomendas de peças necessárias para as intervenções agendadas são realizadas via DMS através do sistema DPMM?" },
      { area: "Agendamento", id: "1.11", text: "Encontra-se implementado o processo de geração atempada da folha de pré-preparação da visita?" },
      { area: "Agendamento", id: "1.12", text: "A Oficina (equipa de AST's) faz reuniões de planeamento de trabalho no dia anterior?" },
      { area: "Agendamento", id: "1.13", text: "Os trabalhos internos (PDS/pré-entrega, montagem de acessórios, check-up de 145 pontos) são agendados e integrados na capacidade da oficina?" },
      { area: "Processo de Receção", id: "2.1", text: "O horário de funcionamento e acolhimento da Receção está desfasado com o início do turno da Oficina?" },
      { area: "Processo de Receção", id: "2.2", text: "A dimensão da equipa de AST's está ajustada para permitir o atendimento de todos os clientes à hora marcada?" },
      { area: "Processo de Receção", id: "2.3", text: "A Oficina atende os clientes estritamente à hora agendada, sem gerar filas de espera?" },
      { area: "Processo de Receção", id: "2.4", text: "O intervalo de tempo entre as marcações permite realizar o processo de receção de acordo com o preconizado pela marca?" },
      { area: "Processo de Receção", id: "2.5", text: "Durante o acolhimento (Receção Ativa), o Assessor de Serviço regista na Ordem de Reparação todas as necessidades adicionais identificadas?" },
      { area: "Processo de Receção", id: "2.6", text: "Nas reparações que exigem pré-diagnóstico, é utilizado o questionário de diagnóstico aprovado pelo NMSC?" },
      { area: "Processo de Receção", id: "2.7", text: "Existe um fluxo de comunicação estruturado entre a Receção e a Oficina?" },
      { area: "Processo de Receção", id: "2.8", text: "Encontra-se definido um procedimento de contacto imediato perante faltas de comparência (no-shows)?" },
      { area: "Processo de Receção", id: "2.9", text: "O Assessor de Serviço define com o cliente a hora de entrega da viatura antes de iniciar o serviço?" },
      { area: "Processo de Receção", id: "2.10", text: "O Assessor de Serviço indicou ao cliente alguma forma de contacto com a oficina durante a realização do serviço?" },
      { area: "Gestão Oficinal", id: "3.1", text: "A distribuição das Ordens de Reparação é efetuada considerando a certificação técnica, a complexidade e o tempo disponível?" },
      { area: "Gestão Oficinal", id: "3.2", text: "Os técnicos realizam o registo eletrónico de tempos (picagens) a 100% para todas as intervenções?" },
      { area: "Gestão Oficinal", id: "3.3", text: "O Quadro de Gestão Oficinal é mantido atualizado em tempo real?" },
      { area: "Gestão Oficinal", id: "3.4", text: "Todas as viaturas presentes na oficina têm Ordem de Reparação aberta?" },
      { area: "Gestão Oficinal", id: "3.5", text: "A gestão das viaturas em espera de serviço é feita regularmente de acordo com a prioridade?" },
      { area: "Gestão Oficinal", id: "3.6", text: "No caso de não comparecimento de um cliente, a slot reservada é alocada novamente para serviços em buffer?" },
      { area: "Gestão Oficinal", id: "3.7", text: "As peças e consumíveis são previamente separados e disponibilizados em carrinhos de pré-pulling?" },
      { area: "Gestão Oficinal", id: "3.8", text: "Os postos de trabalho cumprem os princípios 5S?" },
      { area: "Gestão Oficinal", id: "3.9", text: "A oficina dispõe de um processo/norma para alocar tempo na gestão da produção para serviços adicionais?" },
      { area: "Gestão Oficinal", id: "3.10", text: "É realizado e documentado o Controlo de Qualidade pós-reparação (Fix-It-Right)?" },
      { area: "Gestão Oficinal", id: "3.11", text: "A estação de serviço apresenta acessos desimpedidos e cumpre os critérios 5S?" },
      { area: "Gestão Oficinal", id: "3.12", text: "Ao nível de recursos humanos e estações de serviço, a oficina está ajustada às necessidades?" },
      { area: "Gestão Oficinal", id: "3.13", text: "A oficina utiliza um quadro visual para alocação de viaturas e prioridades de entrega?" },
      { area: "Entrega", id: "4.1", text: "As viaturas são entregues à hora combinada com o cliente?" },
      { area: "Entrega", id: "4.2", text: "Perante atrasos, o cliente é contactado com antecedência e a alteração é registada no DMS?" },
      { area: "Entrega", id: "4.3", text: "No momento da entrega, o Assessor de Serviço explica a fatura item por item?" },
      { area: "Entrega", id: "4.4", text: "No momento da explicação da fatura, o AST garante que todas as questões iniciais do cliente são explicadas?" },
      { area: "Entrega", id: "4.5", text: "O AST acompanha o cliente até à viatura, retirando as proteções na sua presença?" }
    ];

    let currentUser = null;
    let isMaster = false;
    let currentView = "oficinas";
    let currentWorkshopId = null;
    let currentAudit = null;
    let allAudits = [];

    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        isMaster = user.email === MASTER_EMAIL;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        document.getElementById("admin-btn").style.display = isMaster ? "inline-block" : "none";
        await loadWorkshops();
        await loadAudits();
      } else {
        currentUser = null;
        isMaster = false;
        document.getElementById("login-screen").style.display = "flex";
        document.getElementById("app").style.display = "none";
      }
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const btn = document.getElementById("login-btn");
      const errorEl = document.getElementById("login-error");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      errorEl.textContent = "";
      if (!email || !password) { errorEl.textContent = "Preenche email e password"; return; }
      btn.disabled = true; btn.textContent = "A entrar...";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errorEl.textContent = "Email ou password incorretos. Verifica se a conta existe no Firebase.";
        btn.disabled = false; btn.textContent = "Entrar";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
    document.getElementById("admin-btn").addEventListener("click", () => showView("admin"));

    async function loadWorkshops() {
      try {
        const snap = await getDocs(collection(db, "workshops"));
        workshops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (workshops.length === 0) {
          const initial = [
            { name: "Melisauto Odivelas", address: "Av. José Francisco Guerreiro Lote 1, Pontinha" },
            { name: "José Ferreira da Cruz", address: "Av. da República 146, Paredes" },
            { name: "Macedo & Macedo Famalicão", address: "Av. 9 de Julho 462" },
            { name: "Auto Imperial Bragança", address: "Av. das Cantarias 130" },
            { name: "Coutauto Famalicão", address: "Rua Joaquim de Sá Leonardo Lote 8" },
            { name: "Caetano Auto Prior Velho", address: "Rua Nacala 2" }
          ];
          for (const w of initial) await addDoc(collection(db, "workshops"), w);
          const snap2 = await getDocs(collection(db, "workshops"));
          workshops = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
        }
      } catch (e) { workshops = []; }
    }

    async function loadAudits() {
      try {
        const q = query(collection(db, "audits"), orderBy("date", "desc"));
        const snap = await getDocs(q);
        allAudits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { allAudits = []; }
      render();
    }

    function showView(view) {
      currentView = view;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelector(`[data-view="${view}"]`)?.classList.add("active");
      render();
    }

    function render() {
      const main = document.getElementById("main-content");
      const title = document.getElementById("header-title");

      if (currentView === "admin" && isMaster) {
        title.textContent = "Backoffice";
        main.innerHTML = `
          <div class="card">
            <h3>Mudar Password</h3>
            <div class="form-group"><label>Nova Password</label><input
